# The reqs mirror, ghcr.io/brf-tech/runr/reqs/: every third-party image RunR uses (REQS_IMAGES of
# lib/mirror.sh) and the base images of the language runtimes (mirror-bases), copied multi-arch
# from Docker Hub — registry to registry with crane, a pull-through mirror of Docker Hub only by
# Docker Hub's digest when Docker Hub refuses (its anonymous pull limit); an image listed with its
# registry (quay.io/…, ghcr.io/…) from that registry alone. Pushed with the workflow's own
# GITHUB_TOKEN (each reqs package grants this repository write access: PACKAGES.md).
#   - weekly, both lists (a tag that moves upstream, such as alpine:3.21 or a patch release, is
#     copied again)
#   - by hand: both, or one list; mirror-reqs of the images named; a dry run lists what it would copy
name: Mirror reqs images

on:
  workflow_dispatch:
    inputs:
      lists:
        description: 'What to mirror'
        type: choice
        options: [both, reqs, bases]
        default: both
      images:
        description: 'mirror-reqs only these (image or image:tag, blank-separated); empty: every REQS_IMAGES entry'
        required: false
        default: ''
      dry_run:
        description: 'List what would be copied, copy nothing'
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  CRANE_VERSION: v0.21.2
  CRANE_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866

jobs:
  mirror:
    name: Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # crane reads the login above from the Docker config
      - name: Install crane (pinned, checksum verified)
        run: |
          curl -fsSL -o /tmp/crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
      - name: ci.sh mirror-reqs
        if: github.event_name == 'schedule' || inputs.lists != 'bases'
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          IMAGES: ${{ inputs.images }}
        run: |
          read -r -a images <<< "${IMAGES:-}"
          ./ci.sh mirror-reqs ${DRY_RUN:+"$DRY_RUN"} ${images[@]+"${images[@]}"}
      - name: ci.sh mirror-bases
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.lists != 'reqs') }}
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: ./ci.sh mirror-bases ${DRY_RUN:+"$DRY_RUN"}
