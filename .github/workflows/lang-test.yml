# The language bot's tests (README.md, The language bot): after every run of Language releases and
# by hand, each open row "lang: <name> <version> released" of the weekly issue "deps: weekly
# (<ISO year>-W<week>)" (ci/weekly.sh) without a result is tested:
#   - a language runtime (RUNTIME_DEFS of lib/common.sh: python, nodejs, go, php, java, dotnet,
#     ruby, bun): the image of that version built and smoke-tested (the base images mirrored
#     first), this repository's tests, then RunR's main e2e (its last release, ci.sh test on Kind)
#     with the image as the only version of that runtime;
#   - a tool a language image pins (maven, maven-dependency-plugin: exec-java): its ARG moved (and
#     the SHA-512 of its download), every version of the image built and smoke-tested, this
#     repository's tests, then RunR's main e2e on the newest version;
#   - an ML runtime (pytorch, tensorflow): the framework pin moved, the CPU image built and
#     smoke-tested, this repository's tests, then RunR's main e2e with its ML case (--ml) on it; a
#     torch without a wheel for the -gpu image's CUDA is held: its issue closed, nobody asked, the
#     CPU and GPU images stay on their pin together;
#   - a WebAssembly toolchain (spin, tinygo, wasi-sdk, wasm-tools, zig, componentize-py, spin-sdk,
#     rust): its ARG and download checksums moved (rust, tinygo: their mirrored base image too),
#     the images that have it built and smoke-tested, this repository's tests, then RunR's suites
#     that deploy those images (ci.sh test-wasm, test-images).
# A language or ML candidate is pushed as ghcr.io/brf-tech/runr/candidates/exec-<runtime>:<full>
# (a tool's as exec-<image>:<full>-<tool>-<release>), which RunR never discovers by itself, and
# RunR's catalog of the e2e names it by its digest (a tag would run the published version's newest
# patch: ci/lang-bot.sh catalog); a runtime RunR's last release does not have yet skips the
# e2e (the build and the smoke test decide) until RunR's next release brings it; a WebAssembly
# candidate as ghcr.io/brf-tech/runr/candidates/exec-wasm-<lang>:<version>-<tool>-<release>, loaded
# under its published name (RUNTIME_IMAGES_LOCAL=1).
# The plan marks the rows it takes "testing" (a superseded one "superseded"), and the land job
# writes each result into its row; the run's summary has the reports and the ends of the logs.
# Green: committed on main as a fast-forward (tested-versions, or the pin), the publish workflow
# started for the images, the row "published". Red: the row "needs attention" with what failed;
# nothing committed, nothing published (LANG_GATE, lib/patch.sh). An upstream server's 5xx is not
# the release's fault: downloads retry (ci/fetch.sh, the Dockerfiles' download), a RunR suite that
# hit one (or whose failed cases all hit the registry inside its Kind cluster) runs once more, and
# a test that failed on one alone is "upstream outage" and tested again by the next run (a second
# outage in a row: "needs attention"). Several green tests land one after the other on the moving main
# (ci/lang-bot.sh land), each commit with the trailer "RunR-Lang-Bot: <name> <version>", and the
# publish workflow starts once for all of them. An open row "lang: <runtime> <X.Y> end of life
# <date>" is deprecated in the catalog by the land job of the first run that sees it (its sunset the
# end of life, versionDiscovery.lifecycle), and archived once its date is past, nobody asked: the
# image the floating tag named
# stays as exec-<runtime>:eol-<X.Y> with its patch tags, the floating tag goes (RunR no longer
# offers the version; its projects stay locked as end-of-life, running deployments keep their
# image by digest), the records go onto main (runtimes/<runtime>/archived-versions) and the row is
# "archived". The weekly issue carries the label "needs attention" while a row needs a person, and
# closes once every row is done. RunR is its public last release: nothing of RunR's private
# repository is read or written.
name: Language tests

on:
  workflow_run:
    workflows: [Language releases]
    types: [completed]
  workflow_dispatch:
    inputs:
      rows:
        description: 'Rows of the weekly issue to test (again), their keys comma-separated (ruby-4.0.10,go-1.27.4); empty: every open row without a result'
        default: ''

permissions:
  contents: read

concurrency:
  group: lang-test
  cancel-in-progress: false

env:
  CANDIDATES: ghcr.io/brf-tech/runr/candidates
  RUNR_REPOSITORY: BRF-Tech/runr
  # the bot's commits on main: Burak's identity, marked as the bot's by their trailer
  # (RunR-Lang-Bot: <name> <version>, ci/lang-bot.sh land), as in BRF-Tech/runr (RunR-Deps-Bot)
  LANG_BOT_NAME: Burak Faruk ŞAHİN
  LANG_BOT_EMAIL: 19393636+brkfun@users.noreply.github.com

jobs:
  plan:
    name: Issues to test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      e2e: ${{ steps.plan.outputs.e2e }}
      any: ${{ steps.plan.outputs.any }}
      any-e2e: ${{ steps.plan.outputs.any-e2e }}
      archive: ${{ steps.plan.outputs.archive }}
      any-archive: ${{ steps.plan.outputs.any-archive }}
      deprecate: ${{ steps.plan.outputs.deprecate }}
      any-deprecate: ${{ steps.plan.outputs.any-deprecate }}
      runr-tag: ${{ steps.plan.outputs.runr-tag }}
      weekly: ${{ steps.plan.outputs.weekly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.rows }}
        run: |
          only="${ONLY// /}"
          if ! [[ "$only" =~ ^[a-z0-9.,-]*$ ]]; then
            echo "::error::rows '${ONLY}': row keys of the weekly issue separated by commas (ruby-4.0.10,go-1.27.4)"
            exit 1
          fi
          # the open weekly issue and its rows (ci/weekly.sh)
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"deps: weekly" in:title' --limit 50 --json number,title,state,labels,body > "$RUNNER_TEMP/issues.json"
          bash ci/weekly.sh rows "$RUNNER_TEMP/issues.json" > "$RUNNER_TEMP/rows.json"
          jq -c '{issue, week, rows: [.rows[] | {key, state}]}' "$RUNNER_TEMP/rows.json"
          bash ci/lang-bot.sh plan "$RUNNER_TEMP/rows.json" --only="$only" > "$RUNNER_TEMP/plan.json"
          jq . "$RUNNER_TEMP/plan.json"
          tag="$(gh release view --repo "$RUNR_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::RunR's latest release is '${tag}'"; exit 1; }
          # one e2e job per test and RunR suite
          e2e="$(jq -c '[.tests[] | . as $t | .suites[] | $t + {suite: .}]' "$RUNNER_TEMP/plan.json")"
          {
            echo "tests=$(jq -c .tests "$RUNNER_TEMP/plan.json")"
            echo "e2e=${e2e}"
            echo "any=$(jq -r '.tests | length > 0' "$RUNNER_TEMP/plan.json")"
            echo "any-e2e=$(jq -r 'length > 0' <<< "$e2e")"
            # the versions past their end of life the land job archives
            echo "archive=$(jq -c .archive "$RUNNER_TEMP/plan.json")"
            echo "any-archive=$(jq -r '.archive | length > 0' "$RUNNER_TEMP/plan.json")"
            # the versions near their end of life the land job deprecates (their sunset that date)
            echo "deprecate=$(jq -c .deprecate "$RUNNER_TEMP/plan.json")"
            echo "any-deprecate=$(jq -r '.deprecate | length > 0' "$RUNNER_TEMP/plan.json")"
            echo "runr-tag=${tag}"
            echo "weekly=$(jq -r '.issue // empty' "$RUNNER_TEMP/rows.json")"
          } >> "$GITHUB_OUTPUT"
      # the rows this run takes: testing (a test, an archive) or superseded, in the weekly issue
      - name: The weekly issue
        if: steps.plan.outputs.weekly != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEKLY: ${{ steps.plan.outputs.weekly }}
        run: |
          gh label create "needs attention" --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "A row of the weekly issue waits for a person" 2>/dev/null || true
          bash ci/lang-bot.sh plan-updates "$RUNNER_TEMP/plan.json" "$RUN_URL" > "$RUNNER_TEMP/updates.json"
          gh issue view "$WEEKLY" --repo "$GITHUB_REPOSITORY" --json number,title,state,labels,body > "$RUNNER_TEMP/weekly.json"
          bash ci/weekly.sh update "$RUNNER_TEMP/weekly.json" "$RUNNER_TEMP/updates.json" > "$RUNNER_TEMP/ops.json"
          # the tests run whatever the issue's edit does: the land job writes the results
          bash ci/weekly.sh apply "$RUNNER_TEMP/ops.json" || echo "::warning::the weekly issue #${WEEKLY} was not updated"

  build:
    name: ${{ matrix.runtime }} ${{ matrix.full }} build
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      # the base images into the reqs mirror, the candidate images
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    env:
      CRANE_VERSION: v0.21.2
      CRANE_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
      RUNTIME: ${{ matrix.runtime }}
      VERSION: ${{ matrix.version }}
      FULL: ${{ matrix.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install check-jsonschema==0.38.2 PyYAML==6.0.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # every step from here prints into build.log too (exec … tee): a red comment shows the end of
      # it, the lines of the step that failed
      - name: Install crane (pinned, checksum verified)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          bash ci/fetch.sh "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" /tmp/crane.tar.gz "${CRANE_SHA256}"
          sudo tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
      # a language version: its base image mirrored (as publish.yml's bases job does), the image
      # built and smoke-tested, pushed as the candidate RunR's e2e deploys
      - name: Build, smoke test and push the candidate (language)
        if: matrix.kind == 'language'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          ./ci.sh mirror-bases 2>&1 | tail -n 20
          BUILD_REPORT="$RUNNER_TEMP/built" ./ci.sh build "$RUNTIME" --version="$VERSION"
          built="$(awk -v r="$RUNTIME" -v v="$VERSION" '$1 == r && $2 == v { print $3 }' "$RUNNER_TEMP/built")"
          if [ "$built" != "$FULL" ]; then
            echo "the image runs ${RUNTIME} ${built:-nothing}, not ${FULL}: the base image of the reqs mirror is another release"
            exit 1
          fi
          image="${CANDIDATES}/exec-${RUNTIME}:${FULL}"
          docker tag "ghcr.io/brf-tech/runr/exec-${RUNTIME}:${VERSION}" "$image"
          # pushed (again when GHCR refuses a new package's first push), named by its digest
          bash ci/lang-bot.sh push "$image" > "$RUNNER_TEMP/result/image"
          echo "$RUNTIME" > "$RUNNER_TEMP/result/images"
          # the versions published now: a version without a tag is a new one
          crane ls "ghcr.io/brf-tech/runr/exec-${RUNTIME}" | grep -xE '[0-9]+\.[0-9]+' > "$RUNNER_TEMP/result/published" || true
      # a tool of a language image: its ARG (and checksum) moved, every version of the image built
      # and smoke-tested, the newest pushed as the candidate (RunR's default version)
      - name: Move the tool, build, smoke test and push the candidate (a tool of a language image)
        if: matrix.kind == 'tool'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          bash ci/lang-bot.sh tool-bump "$RUNTIME" "$FULL" > "$RUNNER_TEMP/bump.json"
          jq -r .pin "$RUNNER_TEMP/bump.json" | tee "$RUNNER_TEMP/result/pin"
          git diff > "$RUNNER_TEMP/result/pin.patch"
          image="$(jq -r .image "$RUNNER_TEMP/bump.json")"
          ./ci.sh mirror-bases 2>&1 | tail -n 20
          BUILD_REPORT="$RUNNER_TEMP/built" ./ci.sh build "$image"
          newest="$(awk -v r="$image" '$1 == r { print $2, $3 }' "$RUNNER_TEMP/built" | sort -V | tail -n 1)"
          version="${newest%% *}"
          built="${newest#* }"
          [ -n "$version" ] && [ -n "$built" ] || { echo "no version of ${image} was built"; exit 1; }
          candidate="${CANDIDATES}/exec-${image}:${built}-${RUNTIME}-${FULL}"
          docker tag "ghcr.io/brf-tech/runr/exec-${image}:${version}" "$candidate"
          bash ci/lang-bot.sh push "$candidate" > "$RUNNER_TEMP/result/image"
          echo "$image" > "$RUNNER_TEMP/result/images"
          echo "$image" > "$RUNNER_TEMP/result/runtime"
          echo "$version" > "$RUNNER_TEMP/result/version"
      # an ML framework: the pin moved, the CPU image built, smoke-tested and pushed as the candidate.
      # A release without a wheel for the -gpu image's CUDA is held (ml-bump exit 4): nothing built,
      # the land closes its issue, the CPU and GPU images stay on their pin together
      - name: Move the pin, build, smoke test and push the candidate (ML)
        if: matrix.kind == 'ml'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          rc=0
          bash ci/lang-bot.sh ml-bump "$RUNTIME" "$FULL" > "$RUNNER_TEMP/result/pin" 2> "$RUNNER_TEMP/bump.err" || rc=$?
          cat "$RUNNER_TEMP/result/pin" "$RUNNER_TEMP/bump.err"
          if [ "$rc" = 4 ]; then
            cp "$RUNNER_TEMP/bump.err" "$RUNNER_TEMP/result/held"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          git diff > "$RUNNER_TEMP/result/pin.patch"
          ./ci.sh ml-runtimes "$RUNTIME" cpu
          image="${CANDIDATES}/exec-${RUNTIME}:${FULL}"
          docker tag "ghcr.io/brf-tech/runr/exec-${RUNTIME}:${VERSION}" "$image"
          bash ci/lang-bot.sh push "$image" > "$RUNNER_TEMP/result/image"
          echo "$RUNTIME" > "$RUNNER_TEMP/result/images"
      # a WebAssembly toolchain: the ARG and its checksums moved, a new base image mirrored first, the
      # images that have it built, smoke-tested and pushed as candidates
      - name: Move the toolchain, build, smoke test and push the candidates (WebAssembly)
        if: matrix.kind == 'wasm'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          bash ci/lang-bot.sh wasm-bump "$RUNTIME" "$FULL" > "$RUNNER_TEMP/bump.json"
          jq -r .pin "$RUNNER_TEMP/bump.json" | tee "$RUNNER_TEMP/result/pin"
          git diff > "$RUNNER_TEMP/result/pin.patch"
          for name in $(jq -r '.mirror[]' "$RUNNER_TEMP/bump.json"); do
            ./ci.sh mirror-reqs "$name" 2>&1 | tail -n 10
          done
          images="$(jq -r '.images | join(" ")' "$RUNNER_TEMP/bump.json")"
          echo "$images" > "$RUNNER_TEMP/result/images"
          read -ra names <<< "${images//wasm-/}"
          ./ci.sh wasm "${names[@]}"
          : > "$RUNNER_TEMP/result/candidates"
          # every version of the image (4.1, and 4.2 of the runtimes that have it), as ci.sh wasm built them
          for name in $images; do
            while IFS= read -r version; do
              candidate="${CANDIDATES}/exec-${name}:${version}-${RUNTIME}-${FULL}"
              docker tag "ghcr.io/brf-tech/runr/exec-${name}:${version}" "$candidate"
              bash ci/lang-bot.sh push "$candidate" >/dev/null
              echo "${candidate} ghcr.io/brf-tech/runr/exec-${name}:${version}" >> "$RUNNER_TEMP/result/candidates"
            done < <(awk '/^[[:space:]]*-[[:space:]]*version:/ { v = $0; sub(/^[^:]*:[[:space:]]*/, "", v); gsub(/["'"'"' ]/, "", v); print v }' "runtimes/${name}/runtime.yaml")
          done
      # this repository's tests, as ci.yml runs them, on the change
      - name: Shell tests, Dockerfile and reqs mirror checks
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          # a held bump built nothing to test
          [ ! -f "$RUNNER_TEMP/result/held" ] || exit 0
          for t in test/*_test.sh; do echo "── $t"; bash "$t" || exit 1; done
          bash ci/check-dockerfiles.sh
          bash ci/check-reqs-mirror.sh
      # the end of build.log, and the lines of an upstream outage (an HTTP 5xx of a server a
      # download asked: lang-bot.sh upstream), which is not the release's fault
      - name: Result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "$JOB_STATUS" > "$RUNNER_TEMP/result/status"
          if [ "$JOB_STATUS" = success ] && [ -f "$RUNNER_TEMP/result/held" ]; then echo held > "$RUNNER_TEMP/result/status"; fi
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/result/sha"
          tail -n 60 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/result/tail.txt" 2>/dev/null || true
          if [ "$JOB_STATUS" != success ] && bash ci/lang-bot.sh upstream "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/result/upstream"; then
            echo "an upstream outage:"; cat "$RUNNER_TEMP/result/upstream"
          else
            rm -f "$RUNNER_TEMP/result/upstream"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lang-result-${{ matrix.key }}-build
          path: ${{ runner.temp }}/result/
          retention-days: 14

  e2e:
    name: ${{ matrix.runtime }} ${{ matrix.full }} RunR ${{ matrix.suite }}
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.any-e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # one Kind cluster per runner, at most four at a time
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e) }}
    env:
      # the Kind, kubectl, cloud-provider-kind and helm of RunR's kind-suite.yml
      KIND_VERSION: v0.31.0
      KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KUBECTL_VERSION: v1.32.0
      KUBECTL_SHA256: 646d58f6d98ee670a71d9cdffbf6625aeea2849d567f214bc43a35f8ccb7bf70
      CLOUD_PROVIDER_KIND_VERSION: v0.10.0
      CLOUD_PROVIDER_KIND_SHA256: 8b88095d72f8dbb4ce65ecf34e4bde5c1c8a3de90c65e66dda7dcd65fba2d58b
      HELM_VERSION: v3.16.0
      HELM_SHA256: 327cfbc7ddc5a3eb644039ceb0cff66394628654c4f5a76bf715ed15b893983b
      K8S_VERSION: '1.32.0'
      E2E_API_WAIT: '300'
      BOT_KIND: ${{ matrix.kind }}
      RUNTIME: ${{ matrix.runtime }}
      VERSION: ${{ matrix.version }}
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runtimes-repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RUNR_REPOSITORY }}
          ref: ${{ needs.plan.outputs.runr-tag }}
          persist-credentials: false
          path: runr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lang-result-${{ matrix.key }}-build
          path: ${{ runner.temp }}/build
      # the candidate where RunR's e2e takes it: in its catalog (a language, a tool's image, an ML
      # runtime), or the build images under their published names (a WebAssembly toolchain,
      # RUNTIME_IMAGES_LOCAL=1)
      - name: The candidate in RunR
        id: candidate
        env:
          RUNR_TAG: ${{ needs.plan.outputs.runr-tag }}
        run: |
          # every step up to the suite prints into e2e.log too: a red comment shows its end
          exec > >(tee -a "$RUNNER_TEMP/e2e.log") 2>&1
          mkdir -p "$RUNNER_TEMP/result"
          # its bump held it (no wheel for the -gpu image's CUDA): nothing to deploy, nothing failed
          if [ "$(cat "$RUNNER_TEMP/build/status")" = held ]; then
            echo "skipped" > "$RUNNER_TEMP/result/status"
            head -n 1 "$RUNNER_TEMP/build/held" > "$RUNNER_TEMP/result/reason"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(cat "$RUNNER_TEMP/build/status")" != success ]; then
            echo "the build failed: no candidate to deploy"
            exit 1
          fi
          # the runtime and version the e2e deploys: a tool's are its image's newest version
          runtime="$RUNTIME" version="$VERSION"
          if [ "$BOT_KIND" = tool ]; then
            runtime="$(cat "$RUNNER_TEMP/build/runtime")"
            version="$(cat "$RUNNER_TEMP/build/version")"
          fi
          { echo "E2E_RUNTIME=${runtime}"; echo "E2E_VERSION=${version}"; } >> "$GITHUB_ENV"
          case "$BOT_KIND" in
            language|tool|ml)
              # RunR's release before its ML case (test:e2e --ml) has none to run
              if [ "$SUITE" = test-ml ] && ! grep -qF -- '{--ml ' runr/api/app/Console/Commands/E2eTestCommand.php; then
                echo "skipped" > "$RUNNER_TEMP/result/status"
                echo "RunR ${RUNR_TAG} has no ML case yet (test:e2e --ml): it comes with its next release" > "$RUNNER_TEMP/result/reason"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # a runtime RunR's release does not have yet (it comes with its next release): no e2e
              # can deploy it, the build and the smoke test decide
              rc=0
              bash runtimes-repo/ci/lang-bot.sh catalog runr "$runtime" "$version" "$(cat "$RUNNER_TEMP/build/image")" || rc=$?
              if [ "$rc" = 3 ]; then
                echo "skipped" > "$RUNNER_TEMP/result/status"
                echo "RunR ${RUNR_TAG} has no ${runtime} runtime yet: it comes with its next release" > "$RUNNER_TEMP/result/reason"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              [ "$rc" = 0 ] || exit "$rc"
              git -C runr diff --stat ;;
            wasm)
              while read -r candidate published; do
                docker pull -q "$candidate"
                docker tag "$candidate" "$published"
              done < "$RUNNER_TEMP/build/candidates"
              echo "RUNTIME_IMAGES_LOCAL=1" >> "$GITHUB_ENV" ;;
          esac
      - name: Free disk space
        if: steps.candidate.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: inotify limits for Kind
        if: steps.candidate.outputs.skip != 'true'
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - name: Install kind, kubectl, cloud-provider-kind and helm (pinned, checksums verified)
        if: steps.candidate.outputs.skip != 'true'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/e2e.log") 2>&1
          bash runtimes-repo/ci/fetch.sh "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" /tmp/kind "${KIND_SHA256}"
          bash runtimes-repo/ci/fetch.sh "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" /tmp/kubectl "${KUBECTL_SHA256}"
          bash runtimes-repo/ci/fetch.sh "https://github.com/kubernetes-sigs/cloud-provider-kind/releases/download/${CLOUD_PROVIDER_KIND_VERSION}/cloud-provider-kind_${CLOUD_PROVIDER_KIND_VERSION#v}_linux_amd64.tar.gz" /tmp/cpk.tar.gz "${CLOUD_PROVIDER_KIND_SHA256}"
          bash runtimes-repo/ci/fetch.sh "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" /tmp/helm.tar.gz "${HELM_SHA256}"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          sudo tar -xzf /tmp/cpk.tar.gz -C /usr/local/bin cloud-provider-kind
          sudo tar -xzf /tmp/helm.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm
      # the suite: the main e2e for a language (its xaas and faas cases) or an ML runtime (its ML
      # case), test-wasm / test-images for the WebAssembly images; the sandbox cases are left out
      # of the main e2e: they run RunR's sandbox image, not the candidate. A suite that failed on an
      # outage (lang-bot.sh upstream: an upstream server's 5xx for a chart, an image or a package
      # RunR's e2e downloads, or the registry inside its Kind cluster for every failed case) runs
      # once more, with a log of its own.
      - name: RunR's e2e (runtime/ci.sh ${{ matrix.suite }})
        if: steps.candidate.outputs.skip != 'true'
        working-directory: runr
        run: |
          set -o pipefail
          suite() {
            case "$SUITE" in
              test) bash runtime/ci.sh test --skip-sandbox ;;
              test-ml) TEST_E2E_EXTRA_ARGS=--ml bash runtime/ci.sh test --skip-sandbox ;;
              test-wasm|test-images) bash runtime/ci.sh "$SUITE" ;;
              *) echo "unknown suite ${SUITE}"; return 1 ;;
            esac
          }
          rc=0
          suite 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" || rc=$?
          if [ "$rc" != 0 ] && outage="$(bash ../runtimes-repo/ci/lang-bot.sh upstream "$RUNNER_TEMP/e2e.log")"; then
            echo "an upstream outage, RunR's ${SUITE} once more: ${outage%%$'\n'*}"
            printf '%s\n' "$outage" > "$RUNNER_TEMP/result/retried"
            mv "$RUNNER_TEMP/e2e.log" "$RUNNER_TEMP/e2e-first.log"
            sudo rm -f api/storage/e2e-results-*.md || true
            rc=0
            suite 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" || rc=$?
          fi
          [ "$rc" = 0 ] || exit "$rc"
          shopt -s nullglob
          for f in api/storage/e2e-results-*.md; do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            rc=0
            case "$BOT_KIND" in
              language|tool) bash ../runtimes-repo/ci/lang-bot.sh check-e2e "$f" "$E2E_RUNTIME" "$E2E_VERSION" 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" || rc=$? ;;
              ml) bash ../runtimes-repo/ci/lang-bot.sh check-e2e "$f" "$RUNTIME" "$VERSION" --ml 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" || rc=$? ;;
            esac
            # the candidate's own cases failed: whatever else the log shows, no outage
            [ "$rc" = 0 ] || { touch "$RUNNER_TEMP/result/cases-failed"; exit "$rc"; }
          done
      # the end of e2e.log (the last run of the suite), and the lines of an upstream outage
      - name: Result
        if: always() && steps.candidate.outputs.skip != 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "$JOB_STATUS" > "$RUNNER_TEMP/result/status"
          tail -n 60 "$RUNNER_TEMP/e2e.log" > "$RUNNER_TEMP/result/tail.txt" 2>/dev/null || true
          if [ "$JOB_STATUS" != success ] && [ ! -f "$RUNNER_TEMP/result/cases-failed" ] \
            && bash runtimes-repo/ci/lang-bot.sh upstream "$RUNNER_TEMP/e2e.log" > "$RUNNER_TEMP/result/upstream"; then
            echo "an upstream outage:"; cat "$RUNNER_TEMP/result/upstream"
          else
            rm -f "$RUNNER_TEMP/result/upstream"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lang-result-${{ matrix.key }}-e2e-${{ matrix.suite }}
          path: ${{ runner.temp }}/result/
          retention-days: 14

  land:
    name: Commit green versions, archive and deprecate end-of-life ones, report in the weekly issue
    needs: [plan, build, e2e]
    if: ${{ always() && (needs.plan.outputs.any == 'true' || needs.plan.outputs.any-archive == 'true' || needs.plan.outputs.any-deprecate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # tested-versions, the pins and the archive records onto main
      contents: write
      issues: write
      # the publish workflow for a green image (a push of the GITHUB_TOKEN starts no workflow)
      actions: write
      # an end-of-life version archived: its image tagged eol-<version>, its floating tag removed
      # (the Admin role of this repository on the language runtimes' packages, PACKAGES.md)
      packages: write
    env:
      CRANE_VERSION: v0.21.2
      CRANE_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
    steps:
      # the full history and the workflow's token for the one push, HEAD:refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # RunR's last release, for what it pins of a runtime's versions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RUNR_REPOSITORY }}
          ref: ${{ needs.plan.outputs.runr-tag }}
          persist-credentials: false
          path: .runr-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.any == 'true'
        with:
          pattern: lang-result-*
          path: ${{ runner.temp }}/lang/results
      # the archive of an end-of-life version: crane, logged in to the registry
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.plan.outputs.any-archive == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane (pinned, checksum verified)
        if: needs.plan.outputs.any-archive == 'true'
        run: |
          bash ci/fetch.sh "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" /tmp/crane.tar.gz "${CRANE_SHA256}"
          sudo tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
      - name: What RunR pins
        env:
          TESTS: ${{ needs.plan.outputs.tests }}
          RUNR_TAG: ${{ needs.plan.outputs.runr-tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/lang/pins"
          echo "$TESTS" > "$RUNNER_TEMP/lang/tests.json"
          jq -c '.[]' "$RUNNER_TEMP/lang/tests.json" | while read -r t; do
            runtime=$(jq -r .runtime <<< "$t")
            kind=$(jq -r .kind <<< "$t")
            rc=0
            if [ "$kind" = wasm ]; then
              echo "the images keep their version, which RunR ${RUNR_TAG} pins (WASM_RUNTIME_VERSION): nothing to move" > "$RUNNER_TEMP/lang/pins/${runtime}"
            elif [ "$kind" = tool ]; then
              echo "a tool inside the image, which RunR ${RUNR_TAG} does not pin: nothing to move" > "$RUNNER_TEMP/lang/pins/${runtime}"
            else
              out="$(bash ci/lang-bot.sh runr-pins .runr-release "$runtime")" || rc=$?
              case "$rc" in
                0) echo "RunR ${RUNR_TAG} pins no version of ${runtime}: it discovers them in the registry, nothing to move" ;;
                3) echo "RunR ${RUNR_TAG} has no ${runtime} runtime yet: its next release brings it and discovers its versions in the registry, nothing to move" ;;
                *) echo "RunR ${RUNR_TAG} pins ${out}: a person moves them (runtimes:bundle)" ;;
              esac > "$RUNNER_TEMP/lang/pins/${runtime}"
            fi
            cat "$RUNNER_TEMP/lang/pins/${runtime}"
          done
          rm -rf .runr-release
      # the green tests onto main, then the versions past their end of life archived (the registry,
      # their records on main: ci/lang-bot.sh land, archive-one), then the ones near it deprecated
      # (their lifecycle on main: deprecate-one)
      - name: Commit the green ones on main, archive and deprecate the end-of-life ones
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARCHIVE: ${{ needs.plan.outputs.archive }}
          DEPRECATE: ${{ needs.plan.outputs.deprecate }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${ARCHIVE:-[]}" > "$RUNNER_TEMP/lang/archive.json"
          echo "${DEPRECATE:-[]}" > "$RUNNER_TEMP/lang/deprecate.json"
          bash ci/lang-bot.sh land "$RUNNER_TEMP/lang" "$RUN_URL"
      # the results into the rows of the weekly issue (read again: Language releases may have
      # edited it meanwhile), the reports into the run's summary, the one publish
      - name: Report in the weekly issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEKLY: ${{ needs.plan.outputs.weekly }}
        run: |
          [ -f "$RUNNER_TEMP/lang/actions" ] || exit 0
          for f in "$RUNNER_TEMP"/lang/comments/*.md; do
            [ -f "$f" ] || continue
            { echo "### \`$(basename "$f" .md)\`"; echo ""; cat "$f"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          done
          rc=0
          if [ -n "$WEEKLY" ]; then
            awk -F '\t' '$1 == "row"' "$RUNNER_TEMP/lang/actions" \
              | jq -R --arg run "$RUN_URL" 'split("\t") | {key: .[1], state: .[2], note: .[3], run: $run}' | jq -s . > "$RUNNER_TEMP/lang/updates.json"
            gh issue view "$WEEKLY" --repo "$GITHUB_REPOSITORY" --json number,title,state,labels,body > "$RUNNER_TEMP/lang/weekly.json"
            bash ci/weekly.sh update "$RUNNER_TEMP/lang/weekly.json" "$RUNNER_TEMP/lang/updates.json" > "$RUNNER_TEMP/lang/ops.json"
            bash ci/weekly.sh apply "$RUNNER_TEMP/lang/ops.json" || rc=$?
          fi
          images="$(awk -F '\t' '$1 == "publish" { print $2 }' "$RUNNER_TEMP/lang/actions")"
          [ -z "$images" ] || gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f images="$images"
          exit "$rc"
