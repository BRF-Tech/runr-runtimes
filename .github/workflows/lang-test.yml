# The language bot's tests (README.md, The language bot): after every run of Language releases and
# by hand, each open issue "lang: <name> <version> released" without a result is tested:
#   - a language runtime (python, nodejs, go, php): the image of that version built and
#     smoke-tested (the base images mirrored first), this repository's tests, then RunR's main e2e
#     (its last release, ci.sh test on Kind) with the image as the only version of that runtime;
#   - an ML runtime (pytorch, tensorflow): the framework pin moved, the CPU image built and
#     smoke-tested, this repository's tests, then RunR's main e2e with its ML case (--ml) on it;
#   - a WebAssembly toolchain (spin, tinygo, wasi-sdk, wasm-tools, zig, componentize-py, spin-sdk,
#     rust): its ARG and download checksums moved (rust, tinygo: their mirrored base image too),
#     the images that have it built and smoke-tested, this repository's tests, then RunR's suites
#     that deploy those images (ci.sh test-wasm, test-images).
# A language or ML candidate is pushed as ghcr.io/brf-tech/runr/candidates/exec-<runtime>:<full>,
# which RunR never discovers by itself, and RunR's catalog of the e2e names it; a WebAssembly
# candidate as ghcr.io/brf-tech/runr/candidates/exec-wasm-<lang>:<version>-<tool>-<release>, loaded
# under its published name (RUNTIME_IMAGES_LOCAL=1).
# Green: committed on main as a fast-forward (tested-versions, or the pin), the publish workflow
# started for the images, the issue closed with "lang: passed". Red: "needs attention" and a
# comment with what failed; nothing committed, nothing published (LANG_GATE, lib/patch.sh). RunR is
# its public last release: nothing of RunR's private repository is read or written.
name: Language tests

on:
  workflow_run:
    workflows: [Language releases]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue numbers to test (again), comma-separated; empty: every open lang issue without a result'
        default: ''

permissions:
  contents: read

concurrency:
  group: lang-test
  cancel-in-progress: false

env:
  CANDIDATES: ghcr.io/brf-tech/runr/candidates
  RUNR_REPOSITORY: BRF-Tech/runr
  LANG_BOT_NAME: RunR deps bot
  LANG_BOT_EMAIL: deps-bot@runr.sh

jobs:
  plan:
    name: Issues to test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      e2e: ${{ steps.plan.outputs.e2e }}
      any: ${{ steps.plan.outputs.any }}
      any-e2e: ${{ steps.plan.outputs.any-e2e }}
      runr-tag: ${{ steps.plan.outputs.runr-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.issue }}
        run: |
          only="${ONLY// /}"
          if ! [[ "$only" =~ ^[0-9,]*$ ]]; then
            echo "::error::issue '${ONLY}': issue numbers separated by commas"
            exit 1
          fi
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 300 --json number,title,labels > "$RUNNER_TEMP/issues.json"
          bash ci/lang-bot.sh plan "$RUNNER_TEMP/issues.json" --only="$only" > "$RUNNER_TEMP/plan.json"
          jq . "$RUNNER_TEMP/plan.json"
          tag="$(gh release view --repo "$RUNR_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::RunR's latest release is '${tag}'"; exit 1; }
          # one e2e job per test and RunR suite
          e2e="$(jq -c '[.tests[] | . as $t | .suites[] | $t + {suite: .}]' "$RUNNER_TEMP/plan.json")"
          {
            echo "tests=$(jq -c .tests "$RUNNER_TEMP/plan.json")"
            echo "e2e=${e2e}"
            echo "any=$(jq -r '.tests | length > 0' "$RUNNER_TEMP/plan.json")"
            echo "any-e2e=$(jq -r 'length > 0' <<< "$e2e")"
            echo "runr-tag=${tag}"
          } >> "$GITHUB_OUTPUT"
      # the labels (created once), superseded issues closed, re-triggered ones unlabelled
      - name: Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "needs attention" --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "The language bot holds it: a person decides" 2>/dev/null || true
          gh label create "lang: passed" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "The language bot tested it and it is on main" 2>/dev/null || true
          jq -c '.superseded[]' "$RUNNER_TEMP/plan.json" | while read -r s; do
            gh issue close "$(jq -r .issue <<< "$s")" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
              --comment "Superseded by #$(jq -r .by <<< "$s") ($(jq -r .version <<< "$s")): the language bot tests the newest release only ([run](${RUN_URL}))."
          done
          jq -r '.retrigger[]' "$RUNNER_TEMP/plan.json" | while read -r issue; do
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --remove-label "needs attention"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Tested again by the language bot ([run](${RUN_URL}))."
          done

  build:
    name: ${{ matrix.runtime }} ${{ matrix.full }} build
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      # the base images into the reqs mirror, the candidate images
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    env:
      CRANE_VERSION: v0.21.2
      CRANE_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
      RUNTIME: ${{ matrix.runtime }}
      VERSION: ${{ matrix.version }}
      FULL: ${{ matrix.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install check-jsonschema==0.38.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane (pinned, checksum verified)
        run: |
          curl -fsSL -o /tmp/crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
      # a language version: its base image mirrored (as publish.yml's bases job does), the image
      # built and smoke-tested, pushed as the candidate RunR's e2e deploys
      - name: Build, smoke test and push the candidate (language)
        if: matrix.kind == 'language'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          ./ci.sh mirror-bases 2>&1 | tail -n 20 | tee -a "$RUNNER_TEMP/build.log"
          BUILD_REPORT="$RUNNER_TEMP/built" ./ci.sh build "$RUNTIME" --version="$VERSION" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          built="$(awk -v r="$RUNTIME" -v v="$VERSION" '$1 == r && $2 == v { print $3 }' "$RUNNER_TEMP/built")"
          if [ "$built" != "$FULL" ]; then
            echo "the image runs ${RUNTIME} ${built:-nothing}, not ${FULL}: the base image of the reqs mirror is another release" | tee -a "$RUNNER_TEMP/build.log"
            exit 1
          fi
          image="${CANDIDATES}/exec-${RUNTIME}:${FULL}"
          docker tag "ghcr.io/brf-tech/runr/exec-${RUNTIME}:${VERSION}" "$image"
          docker push -q "$image" | tee -a "$RUNNER_TEMP/build.log"
          echo "$image" > "$RUNNER_TEMP/result/image"
          echo "$RUNTIME" > "$RUNNER_TEMP/result/images"
          # the versions published now: a version without a tag is a new one
          crane ls "ghcr.io/brf-tech/runr/exec-${RUNTIME}" | grep -xE '[0-9]+\.[0-9]+' > "$RUNNER_TEMP/result/published" || true
      # an ML framework: the pin moved, the CPU image built, smoke-tested and pushed as the candidate
      - name: Move the pin, build, smoke test and push the candidate (ML)
        if: matrix.kind == 'ml'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          bash ci/lang-bot.sh ml-bump "$RUNTIME" "$FULL" | tee "$RUNNER_TEMP/result/pin"
          git diff > "$RUNNER_TEMP/result/pin.patch"
          ./ci.sh ml-runtimes "$RUNTIME" cpu 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          image="${CANDIDATES}/exec-${RUNTIME}:${FULL}"
          docker tag "ghcr.io/brf-tech/runr/exec-${RUNTIME}:${VERSION}" "$image"
          docker push -q "$image" | tee -a "$RUNNER_TEMP/build.log"
          echo "$image" > "$RUNNER_TEMP/result/image"
          echo "$RUNTIME" > "$RUNNER_TEMP/result/images"
      # a WebAssembly toolchain: the ARG and its checksums moved, a new base image mirrored first, the
      # images that have it built, smoke-tested and pushed as candidates
      - name: Move the toolchain, build, smoke test and push the candidates (WebAssembly)
        if: matrix.kind == 'wasm'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          bash ci/lang-bot.sh wasm-bump "$RUNTIME" "$FULL" > "$RUNNER_TEMP/bump.json"
          jq -r .pin "$RUNNER_TEMP/bump.json" | tee "$RUNNER_TEMP/result/pin"
          git diff > "$RUNNER_TEMP/result/pin.patch"
          for name in $(jq -r '.mirror[]' "$RUNNER_TEMP/bump.json"); do
            ./ci.sh mirror-reqs "$name" 2>&1 | tail -n 10 | tee -a "$RUNNER_TEMP/build.log"
          done
          images="$(jq -r '.images | join(" ")' "$RUNNER_TEMP/bump.json")"
          echo "$images" > "$RUNNER_TEMP/result/images"
          read -ra names <<< "${images//wasm-/}"
          ./ci.sh wasm "${names[@]}" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          : > "$RUNNER_TEMP/result/candidates"
          for name in $images; do
            version="$(awk '/^[[:space:]]*-[[:space:]]*version:/ { v = $0; sub(/^[^:]*:[[:space:]]*/, "", v); gsub(/["'"'"' ]/, "", v); print v; exit }' "runtimes/${name}/runtime.yaml")"
            candidate="${CANDIDATES}/exec-${name}:${version}-${RUNTIME}-${FULL}"
            docker tag "ghcr.io/brf-tech/runr/exec-${name}:${version}" "$candidate"
            docker push -q "$candidate" | tee -a "$RUNNER_TEMP/build.log"
            echo "${candidate} ghcr.io/brf-tech/runr/exec-${name}:${version}" >> "$RUNNER_TEMP/result/candidates"
          done
      # this repository's tests, as ci.yml runs them, on the change
      - name: Shell tests, Dockerfile and reqs mirror checks
        run: |
          set -o pipefail
          { for t in test/*_test.sh; do echo "── $t"; bash "$t" || exit 1; done; bash ci/check-dockerfiles.sh; bash ci/check-reqs-mirror.sh; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "$JOB_STATUS" > "$RUNNER_TEMP/result/status"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/result/sha"
          tail -n 60 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/result/tail.txt" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lang-result-${{ matrix.key }}-build
          path: ${{ runner.temp }}/result/
          retention-days: 14

  e2e:
    name: ${{ matrix.runtime }} ${{ matrix.full }} RunR ${{ matrix.suite }}
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.any-e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # one Kind cluster per runner, at most four at a time
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e) }}
    env:
      # the Kind, kubectl, cloud-provider-kind and helm of RunR's kind-suite.yml
      KIND_VERSION: v0.31.0
      KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KUBECTL_VERSION: v1.32.0
      KUBECTL_SHA256: 646d58f6d98ee670a71d9cdffbf6625aeea2849d567f214bc43a35f8ccb7bf70
      CLOUD_PROVIDER_KIND_VERSION: v0.10.0
      CLOUD_PROVIDER_KIND_SHA256: 8b88095d72f8dbb4ce65ecf34e4bde5c1c8a3de90c65e66dda7dcd65fba2d58b
      HELM_VERSION: v3.16.0
      HELM_SHA256: 327cfbc7ddc5a3eb644039ceb0cff66394628654c4f5a76bf715ed15b893983b
      K8S_VERSION: '1.32.0'
      E2E_API_WAIT: '300'
      BOT_KIND: ${{ matrix.kind }}
      RUNTIME: ${{ matrix.runtime }}
      VERSION: ${{ matrix.version }}
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runtimes-repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RUNR_REPOSITORY }}
          ref: ${{ needs.plan.outputs.runr-tag }}
          persist-credentials: false
          path: runr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lang-result-${{ matrix.key }}-build
          path: ${{ runner.temp }}/build
      # the candidate where RunR's e2e takes it: in its catalog (a language, an ML runtime), or the
      # build images under their published names (a WebAssembly toolchain, RUNTIME_IMAGES_LOCAL=1)
      - name: The candidate in RunR
        id: candidate
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          if [ "$(cat "$RUNNER_TEMP/build/status")" != success ]; then
            echo "the build failed: no candidate to deploy" | tee "$RUNNER_TEMP/e2e.log"
            exit 1
          fi
          case "$BOT_KIND" in
            language|ml)
              # RunR's release before its ML case (test:e2e --ml) has none to run
              if [ "$SUITE" = test-ml ] && ! grep -qF -- '{--ml ' runr/api/app/Console/Commands/E2eTestCommand.php; then
                echo "skipped" > "$RUNNER_TEMP/result/status"
                echo "RunR ${{ needs.plan.outputs.runr-tag }} has no ML case yet (test:e2e --ml): it comes with its next release" > "$RUNNER_TEMP/result/reason"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              bash runtimes-repo/ci/lang-bot.sh catalog runr "$RUNTIME" "$VERSION" "$(cat "$RUNNER_TEMP/build/image")"
              git -C runr diff --stat ;;
            wasm)
              while read -r candidate published; do
                docker pull -q "$candidate"
                docker tag "$candidate" "$published"
              done < "$RUNNER_TEMP/build/candidates"
              echo "RUNTIME_IMAGES_LOCAL=1" >> "$GITHUB_ENV" ;;
          esac
      - name: Free disk space
        if: steps.candidate.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: inotify limits for Kind
        if: steps.candidate.outputs.skip != 'true'
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - name: Install kind, kubectl, cloud-provider-kind and helm (pinned, checksums verified)
        if: steps.candidate.outputs.skip != 'true'
        run: |
          curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          curl -fsSL -o /tmp/cpk.tar.gz "https://github.com/kubernetes-sigs/cloud-provider-kind/releases/download/${CLOUD_PROVIDER_KIND_VERSION}/cloud-provider-kind_${CLOUD_PROVIDER_KIND_VERSION#v}_linux_amd64.tar.gz"
          echo "${CLOUD_PROVIDER_KIND_SHA256}  /tmp/cpk.tar.gz" | sha256sum -c -
          curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          sudo tar -xzf /tmp/cpk.tar.gz -C /usr/local/bin cloud-provider-kind
          sudo tar -xzf /tmp/helm.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm
      # the suite: the main e2e for a language (its xaas and faas cases) or an ML runtime (its ML
      # case), test-wasm / test-images for the WebAssembly images; the sandbox cases are left out
      # of the main e2e: they run RunR's sandbox image, not the candidate
      - name: RunR's e2e (runtime/ci.sh ${{ matrix.suite }})
        if: steps.candidate.outputs.skip != 'true'
        working-directory: runr
        run: |
          set -o pipefail
          case "$SUITE" in
            test) bash runtime/ci.sh test --skip-sandbox 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" ;;
            test-ml) TEST_E2E_EXTRA_ARGS=--ml bash runtime/ci.sh test --skip-sandbox 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" ;;
            test-wasm|test-images) bash runtime/ci.sh "$SUITE" 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" ;;
            *) echo "unknown suite ${SUITE}"; exit 1 ;;
          esac
          shopt -s nullglob
          for f in api/storage/e2e-results-*.md; do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            case "$BOT_KIND" in
              language) bash ../runtimes-repo/ci/lang-bot.sh check-e2e "$f" "$RUNTIME" "$VERSION" | tee -a "$RUNNER_TEMP/e2e.log" ;;
              ml) bash ../runtimes-repo/ci/lang-bot.sh check-e2e "$f" "$RUNTIME" "$VERSION" --ml | tee -a "$RUNNER_TEMP/e2e.log" ;;
            esac
          done
      - name: Result
        if: always() && steps.candidate.outputs.skip != 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "$JOB_STATUS" > "$RUNNER_TEMP/result/status"
          tail -n 60 "$RUNNER_TEMP/e2e.log" > "$RUNNER_TEMP/result/tail.txt" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lang-result-${{ matrix.key }}-e2e-${{ matrix.suite }}
          path: ${{ runner.temp }}/result/
          retention-days: 14

  land:
    name: Commit green versions, report on the issues
    needs: [plan, build, e2e]
    if: ${{ always() && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # tested-versions and the pins onto main
      contents: write
      issues: write
      # the publish workflow for a green image (a push of the GITHUB_TOKEN starts no workflow)
      actions: write
    steps:
      # the full history and the workflow's token for the one push, HEAD:refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # RunR's last release, for what it pins of a runtime's versions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RUNR_REPOSITORY }}
          ref: ${{ needs.plan.outputs.runr-tag }}
          persist-credentials: false
          path: .runr-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lang-result-*
          path: ${{ runner.temp }}/lang/results
      - name: What RunR pins
        env:
          TESTS: ${{ needs.plan.outputs.tests }}
          RUNR_TAG: ${{ needs.plan.outputs.runr-tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/lang/pins"
          echo "$TESTS" > "$RUNNER_TEMP/lang/tests.json"
          jq -c '.[]' "$RUNNER_TEMP/lang/tests.json" | while read -r t; do
            runtime=$(jq -r .runtime <<< "$t")
            if [ "$(jq -r .kind <<< "$t")" = wasm ]; then
              echo "the images keep their version, which RunR ${RUNR_TAG} pins (WASM_RUNTIME_VERSION): nothing to move" > "$RUNNER_TEMP/lang/pins/${runtime}"
            elif out="$(bash ci/lang-bot.sh runr-pins .runr-release "$runtime")"; then
              echo "RunR ${RUNR_TAG} pins no version of ${runtime}: it discovers them in the registry, nothing to move" > "$RUNNER_TEMP/lang/pins/${runtime}"
            else
              echo "RunR ${RUNR_TAG} pins ${out}: a person moves them (runtimes:bundle)" > "$RUNNER_TEMP/lang/pins/${runtime}"
            fi
            cat "$RUNNER_TEMP/lang/pins/${runtime}"
          done
          rm -rf .runr-release
      - name: Commit the green ones on main
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash ci/lang-bot.sh land "$RUNNER_TEMP/lang" "$RUN_URL"
      - name: Report on the issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f "$RUNNER_TEMP/lang/actions" ] || exit 0
          while IFS=$'\t' read -r action issue arg; do
            case "$action" in
              comment) gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$arg" ;;
              label) gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label "$arg" ;;
              close) gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed ;;
              publish) gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f images="$issue" ;;
            esac
          done < "$RUNNER_TEMP/lang/actions"
          cat "$RUNNER_TEMP"/lang/comments/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
