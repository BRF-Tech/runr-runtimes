# The upstream releases the images follow (README.md, The language bot), every week and by hand:
# `ci.sh watch` reports new versions and patch releases of the language runtimes, versions near or
# past their end of life, new releases of the ML frameworks and of the WebAssembly toolchains, and
# newer series of the base images the reqs mirror pins ("base: …", a person's decision).
# Each finding becomes a row of the week's issue "deps: weekly (<ISO year>-W<week>)" once
# (ci/weekly.sh file): a key a weekly issue has, or the title of a closed issue of the earlier bot
# (one issue per finding), is not added again; the open rows of an earlier week's issue move into
# this week's, which closes it with a link; an open issue of the earlier bot is folded in. A row the
# watch no longer finds (it read every upstream) is done. Language tests (lang-test.yml) runs when
# this workflow ends.
name: Language releases

on:
  schedule:
    # Mondays 00:47 UTC, before the reqs mirror (02:17) and the weekly publish (03:17)
    - cron: '47 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lang-releases
  cancel-in-progress: false

jobs:
  watch:
    name: Upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci.sh watch
        id: watch
        env:
          # GitHub's releases API, above the anonymous rate limit
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci.sh watch --report="$RUNNER_TEMP/releases"
      # the findings as rows of the week's issue (ci/weekly.sh file), every issue read for what was
      # found before; an incomplete watch (an upstream did not answer) marks no row done
      - name: The weekly issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH: ${{ steps.watch.outcome }}
        run: |
          gh label create deps --repo "$GITHUB_REPOSITORY" --color 0366d6 \
            --description "The language bot's weekly issue" 2>/dev/null || true
          gh label create "needs attention" --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "A row of the weekly issue waits for a person" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/releases"
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json number,title,state,labels,body > "$RUNNER_TEMP/issues.json"
          complete=()
          [ "$WATCH" != success ] || complete=(--complete)
          bash ci/weekly.sh file "$RUNNER_TEMP/releases" "$RUNNER_TEMP/issues.json" "$(date -u +%F)" "${complete[@]}" > "$RUNNER_TEMP/ops.json"
          jq -c '.[] | {op, issue, key, title, label}' "$RUNNER_TEMP/ops.json"
          bash ci/weekly.sh apply "$RUNNER_TEMP/ops.json" | tee "$RUNNER_TEMP/apply.log"
          weekly="$(sed -n 's/^weekly=//p' "$RUNNER_TEMP/apply.log")"
          [ -z "$weekly" ] || echo "The week's issue: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${weekly}" >> "$GITHUB_STEP_SUMMARY"
