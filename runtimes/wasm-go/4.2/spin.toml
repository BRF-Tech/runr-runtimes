#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json
# Default Spin manifest of a wasm-go 4.2 function (versions[].build.files). One component serves
# every path; RunR's triggers (http, queue, schedule) all arrive as HTTP requests on it.
spin_manifest_version = 2

[application]
name = "runr-function"
version = "0.1.0"
description = "A RunR function (Go, componentize-go + Spin Go SDK v4)"

[[trigger.http]]
route = "/..."
component = "function"

[component.function]
source = "main.wasm"
# outbound HTTP(S) to any host; narrow it in a project's own spin.toml
allowed_outbound_hosts = ["https://*:*", "http://*:*"]

[component.function.build]
command = "go tool componentize-go build"
